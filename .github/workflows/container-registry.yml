name: Build and Push to GHCR

# Builds multi-platform images (linux/amd64 + linux/arm64) so Apple Silicon
# developers get a native arm64 image and CI does not emulate x86.
#
# Expected build time with warm GHA cache: ~6-8 min per service.
# Cold build (no cache): ~12-15 min per service.
#
# Pulling the native arm64 image on Apple Silicon:
#   docker pull ghcr.io/<owner>/stellarkraal-backend:main
#   docker pull ghcr.io/<owner>/stellarkraal-frontend:main
# Docker Desktop on Apple Silicon will automatically select the arm64 layer
# from the multi-arch manifest — no extra flags needed.

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stellarkraal-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stellarkraal-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image_env: BACKEND_IMAGE
          - service: frontend
            context: ./frontend
            image_env: FRONTEND_IMAGE

    steps:
      - uses: actions/checkout@v4

      # QEMU lets the x86 runner execute arm64 instructions via emulation.
      # Required to build the linux/arm64 layer on ubuntu-latest (x86-64).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            # Branch name tag (e.g. main, develop)
            type=ref,event=branch
            # Git commit SHA (short)
            type=sha,prefix=sha-,format=short
            # Semver tags on release (v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest only on semver releases (not on branch pushes)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Produces a multi-arch manifest in GHCR covering both platforms.
          # The arm64 layer is built via QEMU emulation on the ubuntu runner.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope the cache key per service so amd64 and arm64 layer caches
          # do not collide. mode=max caches all intermediate build stages,
          # which is critical for the multi-stage Dockerfiles here.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Verify the pushed manifest actually lists both platforms. Fails the
      # job if the arm64 (or amd64) entry is missing from the manifest list.
      - name: Verify multi-arch manifest for ${{ matrix.service }}
        run: |
          IMAGE="${{ env[matrix.image_env] }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Inspecting manifest for ${IMAGE}@${DIGEST}"
          docker manifest inspect "${IMAGE}@${DIGEST}" > manifest.json
          cat manifest.json
          for arch in amd64 arm64; do
            if ! grep -q "\"architecture\": \"${arch}\"" manifest.json; then
              echo "::error::Manifest for ${IMAGE} is missing linux/${arch}"
              exit 1
            fi
          done
          echo "Manifest for ${IMAGE} lists linux/amd64 and linux/arm64"

      - name: Report image digest
        run: |
          echo "### Multi-arch manifest for ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Registry cleanup: remove untagged/old images to control storage usage.
  cleanup:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write

    steps:
      - name: Delete old backend images (>90 days)
        uses: actions/delete-package-versions@v5
        with:
          package-name: stellarkraal-backend
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          ignore-versions: "^(latest|v\\d+\\.\\d+\\.\\d+)$"
        continue-on-error: true

      - name: Delete old frontend images (>90 days)
        uses: actions/delete-package-versions@v5
        with:
          package-name: stellarkraal-frontend
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          ignore-versions: "^(latest|v\\d+\\.\\d+\\.\\d+)$"
        continue-on-error: true
