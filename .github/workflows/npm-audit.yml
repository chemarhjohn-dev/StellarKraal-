name: npm audit

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    name: Audit backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run npm audit (backend)
        working-directory: backend
        run: |
          if ! npm audit --audit-level=high; then
            echo "::error::Backend has high or critical vulnerabilities. See the Dependabot triage guide: https://github.com/teslims2/stellarkraal/blob/main/docs/DEPENDABOT_TRIAGE.md"
            exit 1
          fi

  audit-frontend:
    name: Audit frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          if ! npm audit --audit-level=high; then
            echo "::error::Frontend has high or critical vulnerabilities. See the Dependabot triage guide: https://github.com/teslims2/stellarkraal/blob/main/docs/DEPENDABOT_TRIAGE.md"
            exit 1
          fi
