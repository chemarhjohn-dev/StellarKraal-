groups:
  - name: contract_invocation_latency
    rules:
      - alert: ContractInvocationLatencyP99High
        expr: histogram_quantile(0.99, sum by (le, operation) (rate(contract_invocation_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Contract invocation p99 latency above 5s for {{ $labels.operation }}"
          description: "The p99 latency of Soroban contract invocations for operation {{ $labels.operation }} has exceeded 5 seconds for more than 5 minutes (current value: {{ $value }}s)."
